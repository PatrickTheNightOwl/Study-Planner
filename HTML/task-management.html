<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title -->
    <title>Study Planner</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../Assets/favicon.png"
    />

    <!-- Fonts -->
    <link rel="stylesheet" href="../CSS/task-management-style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav id="sidebar">
      <div id="brand">
        <img src="../Assets/icon.png" alt="" class="website-logo" />
        <a href="index.html" id="website-name">Study Planner</a>
      </div>

      <ul id="nav-list">
        <li class="nav-item">
          <a href="dashboard.html" class="nav-link">📊Dashboard</a>
        </li>
        <li class="nav-item">
          <a href="subject-management.html" class="nav-link"
            >📚Subject Management</a
          >
        </li>
        <li class="nav-item">
          <a href="task-management.html" class="nav-link active"
            >📋Task Management</a
          >
        </li>

        <li class="nav-item">
          <a href="settings.html" class="nav-link">⚙️Settings</a>
        </li>
      </ul>
    </nav>
    <div id="main-content">
      <div id="top">
        <div id="page-title"><h1>Task Management</h1></div>

        <button id="add-task">✏️ Edit Task</button>
      </div>
      <div id="tasks-container"></div>
    </div>
    <div id="modal-overlay" class="hidden">
      <div id="modal">
        <h2>Task</h2>
        <input
          type="text"
          id="task-name"
          placeholder="Example : math assignment, project, etc."
        />

        <h2>Subject</h2>
        <select name="subject" id="subject-selector" class="selector"></select>
        <h3>*Deleting task only requires task and subject</h3>
        <h2>Deadline (Date&Time)</h2>
        <div class="deadline-section">
          <input type="date" id="deadline-date" class="selector" />
          <input type="time" id="deadline-time" class="selector" />
        </div>

        <h2>Priority</h2>
        <select name="priority" id="priority-selector" class="selector">
          <option value="" disabled selected>Select Priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <div class="cancel-save">
          <button class="cancel-save-btn" id="cancel-btn">Cancel</button>
          <button class="cancel-save-btn" id="del-btn">Delete</button>
          <button class="cancel-save-btn" id="save-btn">Save</button>
        </div>
      </div>
    </div>
    <script src="../JS/task-management.js"></script>
  </body>
</html>
