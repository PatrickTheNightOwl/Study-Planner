<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15233b" />
    <title>Tasks | Study Planner</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../Assets/favicon.png" />
    <link rel="stylesheet" href="../CSS/app-shell.css?v=3" />
    <link rel="stylesheet" href="../CSS/task-management-style.css?v=2" />
  </head>
  <body>
    <nav id="sidebar" aria-label="Main navigation">
      <div id="brand">
        <img src="../Assets/icon.png" alt="" class="website-logo" />
        <a href="index.html" id="website-name">Study Planner</a>
      </div>

      <ul id="nav-list">
        <li class="nav-item"><a href="dashboard.html" class="nav-link"><span class="nav-icon" aria-hidden="true">&#9638;</span><span>Dashboard</span></a></li>
        <li class="nav-item"><a href="subject-management.html" class="nav-link"><span class="nav-icon" aria-hidden="true">&#9635;</span><span>Subjects</span></a></li>
        <li class="nav-item"><a href="task-management.html" class="nav-link active" aria-current="page"><span class="nav-icon" aria-hidden="true">&#10003;</span><span>Tasks</span></a></li>
        <li class="nav-item"><a href="settings.html" class="nav-link"><span class="nav-icon" aria-hidden="true">&#9881;</span><span>Settings</span></a></li>
      </ul>
    </nav>

    <main id="main-content">
      <header id="top">
        <div id="page-title"><h1>Tasks</h1></div>
        <button id="add-task" type="button"><span aria-hidden="true">+</span> Add task</button>
      </header>
      <section id="tasks-container" aria-label="Your tasks"></section>
    </main>

    <div id="modal-overlay" class="hidden">
      <div id="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
        <h2 id="task-modal-title">Manage task</h2>
        <input type="text" id="task-name" placeholder="Example: Math assignment, project" aria-label="Task name" />

        <h2>Subject</h2>
        <select name="subject" id="subject-selector" class="selector" aria-label="Task subject"></select>
        <h3>Deleting a task needs the task name and subject.</h3>

        <h2>Deadline</h2>
        <div class="deadline-section">
          <input type="date" id="deadline-date" class="selector" aria-label="Deadline date" />
          <input type="time" id="deadline-time" class="selector" aria-label="Deadline time" />
        </div>

        <h2>Priority</h2>
        <select name="priority" id="priority-selector" class="selector" aria-label="Task priority">
          <option value="" disabled selected>Select priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <div class="cancel-save">
          <button class="cancel-save-btn" id="cancel-btn" type="button">Cancel</button>
          <button class="cancel-save-btn" id="del-btn" type="button">Delete</button>
          <button class="cancel-save-btn" id="save-btn" type="button">Save</button>
        </div>
      </div>
    </div>

    <script src="../JS/task-management.js?v=2"></script>
  </body>
</html>
