<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Planner</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../Assets/favicon.png"
    />

    <!-- Fonts -->
    <link rel="stylesheet" href="../CSS/authentication.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="auth-section">
      <div id="brand">
        <img src="../Assets/icon.png" alt="" class="website-logo" />
        <a href="index.html" id="website-name">Study Planner</a>
      </div>
      <h1 id="slogan">Where you organize your study.</h1>
      <h1 id="caption">Sign Up</h1>
      <form action="" id="form">
        <p>Email</p>
        <input type="text" placeholder="Your email account" id="input-email" />
        <p>Password</p>
        <input
          type="password"
          placeholder="Your password"
          id="input-password"
        />
        <div id="signup">
          <button id="btn" type="submit">Sign Up</button>
        </div>
      </form>
    </div>
    <script src="../JS/database.js"></script>
    <script src="../JS/sign-up.js"></script>
  </body>
</html>
