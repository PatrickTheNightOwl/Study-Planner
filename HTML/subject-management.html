<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title -->
    <title>Study Planner</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../Assets/favicon.png"
    />

    <!-- Fonts -->
    <link rel="stylesheet" href="../CSS/subject-management-style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav id="sidebar">
      <div id="brand">
        <img src="../Assets/icon.png" alt="" class="website-logo" />
        <a href="index.html" id="website-name">Study Planner</a>
      </div>

      <ul id="nav-list">
        <li class="nav-item">
          <a href="dashboard.html" class="nav-link">📊Dashboard</a>
        </li>
        <li class="nav-item">
          <a href="subject-management.html" class="nav-link active"
            >📚Subject Management</a
          >
        </li>
        <li class="nav-item">
          <a href="task-management.html" class="nav-link">📋Task Management</a>
        </li>
        <li class="nav-item">
          <a href="settings.html" class="nav-link">⚙️Settings</a>
        </li>
      </ul>
    </nav>
    <div id="main-content">
      <div id="top">
        <div id="page-title"><h1>Subject Management</h1></div>

        <button id="add-subject">+ Edit Subject</button>
      </div>
      <div id="subjects-container"></div>
    </div>
    <div id="modal-overlay" class="hidden">
      <div id="modal">
        <h2>Subject</h2>
        <input
          type="text"
          id="subject-name"
          placeholder="Example: Math, Literature, English, etc."
        />

        <h2>Color Picker</h2>
        <h2>(unavailable for deleting subject)</h2>
        <div id="color-recommendation">
          <button class="color" data-color="#9CA3AF"></button>
          <button class="color" data-color="#EF4444"></button>
          <button class="color" data-color="#F97316"></button>
          <button class="color" data-color="#EAB308"></button>
          <button class="color" data-color="#22C55E"></button>
          <button class="color" data-color="#3B82F6"></button>
          <button class="color" data-color="#8B5CF6"></button>
          <button class="color" data-color="#EC4899"></button>
        </div>
        <div class="cancel-save">
          <button class="cancel-save-btn" id="cancel-btn">Cancel</button
          ><button class="cancel-save-btn" id="del-btn">Delete</button>
          <button class="cancel-save-btn" id="save-btn">Save</button>
        </div>
      </div>
    </div>
    <script src="../JS/subject-management.js"></script>
  </body>
</html>
